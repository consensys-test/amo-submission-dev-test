name: Publish AMO reviewer artifacts (UAT fixture)
description: >-
  Package fixture Firefox reviewer source + approval notes and upload to the
  UAT private S3 bucket via a hand-rolled fixture OIDC role (not Terraform).
  Mirrors MetaMask publish-amo-reviewer-artifacts key layout so UAT
  amo-submission:dev can GetObject + attach source. No GitHub secrets required.

# UAT fixture contract (manual IAM — NOT va-mmc-extension-submission-infra):
#   bucket: uat-va-mmc-extension-submission-amo-reviewer-source
#   role:   arn:aws:iam::722264665990:role/amo-reviewer-publisher-fixture

runs:
  using: composite
  steps:
    - name: Package Firefox reviewer artifacts (fixture)
      shell: bash
      run: bash "${GITHUB_WORKSPACE}/.github/scripts/publish-firefox-reviewer-artifacts.sh" package

    - name: Configure AWS credentials (UAT fixture publisher)
      uses: aws-actions/configure-aws-credentials@acca2b1b2070338fb9fd1ca27ecee81d687e58e5 # v6.1.2
      with:
        role-to-assume: arn:aws:iam::722264665990:role/amo-reviewer-publisher-fixture
        aws-region: us-east-2

    - name: Upload Firefox reviewer artifacts (UAT)
      shell: bash
      env:
        AMO_REVIEWER_BUCKET: uat-va-mmc-extension-submission-amo-reviewer-source
        AWS_DEFAULT_REGION: us-east-2
      run: bash "${GITHUB_WORKSPACE}/.github/scripts/publish-firefox-reviewer-artifacts.sh" upload
